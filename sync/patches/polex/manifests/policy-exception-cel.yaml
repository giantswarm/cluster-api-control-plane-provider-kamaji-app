{{- if .Values.kyvernoPolicyExceptions.enabled }}
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  labels:
    app.kubernetes.io/instance: '{{ .Release.Name }}'
    app.kubernetes.io/managed-by: '{{ .Release.Service }}'
    app.kubernetes.io/name: '{{ .Chart.Name }}'
    app.kubernetes.io/version: '{{ .Chart.AppVersion }}'
    helm.sh/chart: '{{ .Chart.Name }}'
    io.giantswarm.application.team: '{{ index .Chart.Annotations "io.giantswarm.application.team"
      }}'
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
  name: capi-kamaji-controller-manager
  namespace: giantswarm
spec:
  policyRefs:
  - name: restrict-seccomp-strict
    kind: ValidatingPolicy
  # check-resources-request-and-limits-ratio is a supplemental policy and usually
  # not enabled. It is excepted because the capi-kamaji-controller-manager
  # Deployment fails it when the policy is enforced.
  - name: check-resources-request-and-limits-ratio
    kind: ValidatingPolicy
  # require-ro-rootfs is a supplemental policy and usually not enabled. It is
  # excepted because the capi-kamaji-controller-manager Deployment fails it when
  # the policy is enforced.
  - name: require-ro-rootfs
    kind: ValidatingPolicy
  # restrict-sa-automount-sa-token is a supplemental policy and usually not
  # enabled. It is excepted because the capi-kamaji-controller-manager
  # ServiceAccount fails it when the policy is enforced.
  - name: restrict-sa-automount-sa-token
    kind: ValidatingPolicy
  matchConditions:
  - name: capi-kamaji-controller-manager-workloads
    # ServiceAccount is matched for restrict-sa-automount-sa-token.
    expression: >-
      request.kind.kind in ['Deployment', 'ReplicaSet', 'Pod', 'ServiceAccount'] &&
      request.namespace == '{{ .Release.Namespace }}' &&
      has(object.metadata.name) &&
      (object.metadata.name == 'capi-kamaji-controller-manager' || object.metadata.name.startsWith('capi-kamaji-controller-manager-'))
{{- end }}
