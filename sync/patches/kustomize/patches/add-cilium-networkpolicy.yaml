apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: capi-kamaji-controller-manager
  namespace: "{{ .Release.Namespace }}"
spec:
  egress:
  - toEntities:
    - kube-apiserver
  endpointSelector:
    matchLabels:
      cluster.x-k8s.io/provider: kamaji
      app.kubernetes.io/component: manager
  ingress:
  - fromEntities:
    - cluster
    - kube-apiserver
